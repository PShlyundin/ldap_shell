[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ldap_shell"
version = "2.0.0"
description = "Interactive and inline LDAP shell for Active Directory ACL abuse"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Riocool", email = "Riocool33@gmail.com" },
]
keywords = ["ldap", "active-directory", "security"]
dependencies = [
    "ldap3>=2.9.1,<3",
    "ldapdomaindump>=0.9.4",
    "pyasn1>=0.4.8",
    "pycryptodomex>=3.20",
    "dsinternals>=1.2.4",
    "minikerberos>=0.4.0",
    "winsspi>=0.0.10; sys_platform == 'win32'",
    "impacket>=0.11.0",
    "pyOpenSSL>=24.0.0",
    "cryptography>=42.0.0",
    "prompt_toolkit>=3.0.36",
    "pydantic>=2.0,<3",
    "oscrypto @ git+https://github.com/wbond/oscrypto.git@d5f3437ed24257895ae1edd9e503cfb352e635a8",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "mcp>=1.2"]

[project.scripts]
ldap_shell = "ldap_shell.__main__:main"

[project.urls]
Homepage = "https://github.com/PShlyundin/ldap_shell"

[tool.setuptools.packages.find]
include = ["ldap_shell*"]

[tool.setuptools.package-data]
ldap_shell = ["ldap_modules/*/ldap_module.py", "ldap_modules/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
