name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and quality extras
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check ldap_shell/runner.py ldap_shell/utils/security_utils.py ldap_shell/utils/module_loader.py tests
      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing
